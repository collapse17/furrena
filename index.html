<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101419" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23e85d34'/%3E%3Cpath d='M9 7h15v5H15v3h7v5h-7v6H9z' fill='white'/%3E%3C/svg%3E"
    />
    <title>Furrena</title>
  </head>
  <body>
    <main id="app">
      <canvas id="game-canvas" aria-label="Игровая область Furrena"></canvas>
      <div id="game-hud" class="game-hud" hidden></div>
      <div id="audio-controls" class="audio-controls" hidden>
        <button id="audio-mute" type="button" aria-pressed="false">
          Звук: вкл.
        </button>
        <label
          >Громкость
          <input id="audio-volume" type="range" min="0" max="1" step="0.05"
        /></label>
        <span id="audio-status" aria-live="polite"></span>
      </div>
      <div
        id="game-crosshair"
        class="game-crosshair"
        hidden
        aria-hidden="true"
      ></div>
      <button
        id="status-overlay"
        class="status-overlay"
        type="button"
        aria-label="Начать игру"
      >
        <p>Загрузка Furrena…</p>
      </button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
